# Single-domain setup: frontend, API and short links all on one domain.
# Example: https://lnk.yourdomain.in
#   /api/*        -> Node API
#   /<shortCode>  -> Node API (redirect)
#   /dashboard, /login, /u/<name> ... -> React app (index.html)
#
# Copy to /etc/nginx/sites-available/linkzy, symlink into sites-enabled,
# then run: sudo certbot --nginx -d lnk.yourdomain.in

upstream linkzy_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Basic per-IP rate limit at the edge (the app has its own limits too)
limit_req_zone $binary_remote_addr zone=linkzy_req:10m rate=30r/s;

server {
    listen 80;
    server_name lnk.yourdomain.in;

    root /var/www/linkzy/frontend/dist;
    index index.html;

    client_max_body_size 1m;
    limit_req zone=linkzy_req burst=60 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API
    location /api/ {
        proxy_pass http://linkzy_api;
    }

    location = /health {
        proxy_pass http://linkzy_api;
    }

    # Built static assets: long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React routes that must NOT be treated as short codes
    location ~ ^/(login|register|dashboard|links|bio|admin|report|not-found|u|billing|terms|privacy|refund|contact)(/|$) {
        try_files $uri /index.html;
    }

    # Root: landing page
    location = / {
        try_files /index.html =404;
    }

    # Everything else with a single path segment = short link -> Node redirect
    location ~ "^/[a-zA-Z0-9_-]{4,30}$" {
        proxy_pass http://linkzy_api;
    }

    # Fallback: static file or SPA
    location / {
        try_files $uri /index.html;
    }
}
