# Two-domain setup used in production:
#   https://chhotulink.online       -> React app + short links (/<shortCode> -> Node redirect)
#   https://api.chhotulink.online   -> Node API (your existing server block, unchanged)
#
# Only the chhotulink.online block is below. Merge these locations into your existing
# server block for chhotulink.online (the one certbot already added SSL to), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set 127.0.0.1:6011 to the same port your api.chhotulink.online block proxies to.

upstream chhotulink_api {
    server 127.0.0.1:6011;
    keepalive 64;
}

server {
    server_name chhotulink.online www.chhotulink.online;

    root /var/www/linkzy/frontend/dist;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Built static assets: long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React routes that must NOT be treated as short codes
    location ~ ^/(login|register|dashboard|links|bio|admin|report|not-found|u|billing|terms|privacy|refund|contact)(/|$) {
        try_files $uri /index.html;
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # One path segment with no dot = short link -> Node does the redirect and counts the click.
    # Files like /favicon.svg, /robots.txt, /sitemap.xml contain a dot, so they never match.
    location ~ "^/[a-zA-Z0-9_-]{4,30}$" {
        proxy_pass http://chhotulink_api;
    }

    # Everything else: static file or SPA
    location / {
        try_files $uri /index.html;
    }

    # listen 443 ssl; + ssl_certificate lines stay as certbot wrote them in your existing block
}
